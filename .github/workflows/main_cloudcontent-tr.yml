# Azure Deployment Center workflow — cloudcontent-tr
# Requires GitHub secret: DATABASE_URL (PostgreSQL connection string, sslmode=require for Azure)

name: Build and deploy Node.js app to Azure Web App - cloudcontent-tr

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: npm

      - name: Validate DATABASE_URL secret
        run: npx tsx scripts/ensure-database-url.ts --ci

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Prisma migrate deploy
        run: npm run prisma:migrate:deploy

      - name: Build
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run build

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: .

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_944D345CB5624ACF8F76707F3F138F99 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_8D576BC1FC1543B29EB19378EFC52E33 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_A190933E79554237B01FA39E29833C9E }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: cloudcontent-tr
          slot-name: Production
          package: .
