# Deploy CloudContent TR to Azure App Service (optional — you can also use Deployment Center).
#
# Required GitHub secrets (Repository → Settings → Secrets and variables → Actions):
#   AZURE_WEBAPP_NAME          — e.g. cloudcontent-tr-prod
#   AZURE_RESOURCE_GROUP        — e.g. rg-cloudcontent-prod
#   AZURE_CREDENTIALS           — JSON from `az ad sp create-for-rbac` (OIDC preferred — see README)
#   DATABASE_URL                — REQUIRED: PostgreSQL URL (migrate + Next.js build env for Prisma schema)
#
# Optional:
#   AZURE_WEBAPP_SLOT           — staging slot name

name: Deploy to Azure App Service

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  NODE_VERSION: "20.x"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Validate DATABASE_URL secret
        run: npx tsx scripts/ensure-database-url.ts --ci

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npm run prisma:generate

      - name: Prisma migrate deploy
        run: npm run prisma:migrate:deploy

      - name: Build
        env:
          NODE_ENV: production
        run: npm run build

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          package: .next/standalone

      # Migrations run in CI above. Set App Service Startup Command to:
      #   bash startup.sh
      # or (standalone root after deploy):
      #   node server.js
